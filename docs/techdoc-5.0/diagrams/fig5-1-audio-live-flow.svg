<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#64748B"/></marker></defs><defs><marker id="arrP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#94A3B8"/></marker></defs><rect x="60" y="40" width="360" height="64" rx="8" fill="#E8F0F8" stroke="#64748B" stroke-width="1.6"/><text x="240.0" y="57.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">开始实时会话</text><text x="240.0" y="86.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">POST /audio/live/start → processing</text><rect x="60" y="130" width="360" height="64" rx="8" fill="#E8F0F8" stroke="#64748B" stroke-width="1.6"/><text x="240.0" y="147.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">上传分片</text><text x="240.0" y="176.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">live/chunk（seq, offset_seconds）</text><rect x="60" y="220" width="360" height="64" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="240.0" y="237.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">保存分片文件</text><text x="240.0" y="266.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">audio/{id}/chunks/000N.ext</text><rect x="60" y="310" width="360" height="64" rx="8" fill="#EAF2F0" stroke="#64748B" stroke-width="1.6"/><text x="240.0" y="327.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">逐片 ASR</text><text x="240.0" y="356.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">TranscriptionClient（外部/本地 FunASR）</text><rect x="60" y="410" width="360" height="64" rx="8" fill="#EAF2F0" stroke="#64748B" stroke-width="1.6"/><text x="240.0" y="427.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">追加分段 + 重建全文</text><text x="240.0" y="456.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">segments[{seq, offset_seconds, text}]</text><rect x="60" y="510" width="360" height="64" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="240.0" y="527.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">结束：合并分片 + 清理</text><text x="240.0" y="556.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">live/finish → transcribed / failed</text><rect x="60" y="610" width="360" height="64" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><text x="240.0" y="627.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">标记 + 编辑转写</text><text x="240.0" y="656.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">segments/marker、PATCH /audio/{id}</text><rect x="60" y="710" width="360" height="64" rx="8" fill="#E8F0F8" stroke="#64748B" stroke-width="1.6"/><text x="240.0" y="727.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">确认 → 生成会议记录</text><text x="240.0" y="756.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">confirm → RecordType.transcript</text><rect x="520" y="380" width="380" height="70" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6" stroke-dasharray="8 6"/><text x="710.0" y="400.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">分片失败：记录 error（不中断）</text><text x="710.0" y="429.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">segment.error 保留，整体继续处理</text><rect x="520" y="490" width="380" height="70" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6" stroke-dasharray="8 6"/><text x="710.0" y="510.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">分片重试</text><text x="710.0" y="539.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">POST /audio/{id}/segments/{seq}/retry</text><rect x="40" y="810" width="1420" height="60" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="8 6"/><text x="750.0" y="840.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">说明：分块上传 + 逐片转写（非 WebSocket/SSE 流式）；已确认音频（有 record_id）不可删除；时间偏移以 offset_seconds 记录。</text><path d="M 240,104 L 240,130" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 240,194 L 240,220" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 240,284 L 240,310" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 240,374 L 240,410" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/><text x="275" y="392" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle">成功</text><path d="M 240,474 L 240,510" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 240,574 L 240,610" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 240,674 L 240,710" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 420,342 L 520,415" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrP)" stroke-dasharray="7 5"/><text x="455" y="360" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle">失败</text><path d="M 710,450 L 710,490" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 520,525 L 470,525 L 470,360 L 420,360" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrP)" stroke-dasharray="7 5"/><line x1="40" y1="880" x2="80" y2="880" stroke="#64748B" stroke-width="1.6"/><text x="88" y="880" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#475569">实线 = 正常流程</text><line x1="360" y1="880" x2="400" y2="880" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="7 5"/><text x="408" y="880" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#475569">虚线 = 失败分支 / 分片重试</text></svg>