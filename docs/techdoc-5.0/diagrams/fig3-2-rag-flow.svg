<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="900" viewBox="0 0 1560 900" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#64748B"/></marker></defs><defs><marker id="arrP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#94A3B8"/></marker></defs><rect x="40" y="40" width="150" height="78" rx="8" fill="#E8F0F8" stroke="#64748B" stroke-width="1.6"/><text x="115.0" y="79.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">用户问题</text><rect x="40" y="150" width="230" height="78" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><text x="155.0" y="174.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">身份 / 权限上下文</text><text x="155.0" y="203.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">current_user.user_id</text><rect x="40" y="260" width="230" height="78" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><text x="155.0" y="270.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">选择 scope</text><text x="155.0" y="299.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">current_meeting</text><text x="155.0" y="328.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">knowledge_base</text><rect x="340" y="40" width="620" height="190" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="650.0" y="91.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">检索泳道 A：会议材料</text><text x="650.0" y="120.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">document_chunks → meeting_materials → meetings</text><text x="650.0" y="149.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">SQL 过滤 meetings.user_id = current_user</text><text x="650.0" y="178.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">（当前会议 scope 加 meeting_materials.meeting_id）</text><rect x="340" y="260" width="620" height="190" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="650.0" y="326.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">检索泳道 B：个人知识库</text><text x="650.0" y="355.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">knowledge_chunks → knowledge_documents</text><text x="650.0" y="384.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">SQL 过滤 knowledge_documents.user_id = current_user</text><rect x="340" y="480" width="620" height="78" rx="8" fill="#EAF2F0" stroke="#64748B" stroke-width="1.6"/><text x="650.0" y="504.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">query embedding（候选集生成后）</text><text x="650.0" y="533.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">Embedding 1024 维</text><rect x="1020" y="200" width="340" height="120" rx="8" fill="#EAF2F0" stroke="#64748B" stroke-width="1.6"/><text x="1190.0" y="231.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">应用层余弦相似度排序</text><text x="1190.0" y="260.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">候选分块 × query 向量</text><text x="1190.0" y="289.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">（非 pgvector ANN）</text><rect x="1020" y="360" width="340" height="80" rx="8" fill="#EAF2F0" stroke="#64748B" stroke-width="1.6"/><text x="1190.0" y="385.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">Top-K 筛选</text><text x="1190.0" y="414.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">top_k=5 · min_score=0.3</text><rect x="1020" y="480" width="340" height="150" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><text x="1190.0" y="511.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">Prompt 组装</text><text x="1190.0" y="540.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">检索片段（泳道 A/B）</text><text x="1190.0" y="569.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">最近会议记录（20 条 · ≤8000 字）</text><text x="1190.0" y="598.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">用户记忆（memory_context_for, &quot;chat&quot;）</text><rect x="1020" y="670" width="340" height="80" rx="8" fill="#E8EEF6" stroke="#64748B" stroke-width="1.6"/><text x="1190.0" y="695.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">LLM</text><text x="1190.0" y="724.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">OpenAI 兼容 /chat/completions</text><rect x="1370" y="670" width="190" height="80" rx="8" fill="#E8F0F8" stroke="#64748B" stroke-width="1.6"/><text x="1465.0" y="710.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">answer + sources</text><rect x="40" y="700" width="900" height="110" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><text x="490.0" y="740.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">证据不足分支</text><text x="490.0" y="769.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">无片段且无会议记录 → 返回“证据不足”，不编造答案</text><path d="M 190,79 L 190,150" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 155,228 L 155,260" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 270,299 L 340,299" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrP)" stroke-dasharray="7 5"/><text x="305" y="283" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle">scope=current_meeting</text><path d="M 270,299 L 340,355" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrP)" stroke-dasharray="7 5"/><text x="305" y="420" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle">scope=knowledge_base</text><path d="M 270,299 L 340,519" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrP)" stroke-dasharray="7 5"/><text x="305" y="505" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle">（并行）</text><path d="M 960,135 L 1020,260" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/><text x="990" y="175" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle">候选分块</text><path d="M 960,355 L 1020,260" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 960,519 L 1020,260" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/><text x="990" y="400" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle">query 向量</text><path d="M 1190,320 L 1190,360" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 1190,440 L 1190,480" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 1190,630 L 1190,670" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 1360,710 L 1400,710" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 1190,300 L 940,755" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrP)" stroke-dasharray="7 5"/><text x="1080" y="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle">无片段且无记录</text><line x1="40" y1="880" x2="80" y2="880" stroke="#64748B" stroke-width="1.6"/><text x="88" y="880" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#475569">实线 = 当前数据流</text><line x1="360" y1="880" x2="400" y2="880" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="7 5"/><text x="408" y="880" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#475569">虚线 = scope 分支 / 证据不足分支</text></svg>