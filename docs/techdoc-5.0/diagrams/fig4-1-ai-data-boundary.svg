<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="880" viewBox="0 0 1560 880" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#64748B"/></marker></defs><defs><marker id="arrP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#94A3B8"/></marker></defs><rect x="40" y="40" width="700" height="86" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><text x="390.0" y="68.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">OpenMIND 本地应用与数据</text><text x="390.0" y="97.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">前端 · FastAPI 后端 · PostgreSQL+pgvector · storage/</text><rect x="860" y="40" width="660" height="86" rx="8" fill="#E8EEF6" stroke="#64748B" stroke-width="1.6"/><text x="1190.0" y="68.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">外部 AI 服务（云端）</text><text x="1190.0" y="97.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">数据出网边界 →</text><rect x="40" y="160" width="340" height="100" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="210.0" y="181.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">业务内容</text><text x="210.0" y="210.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">问题 / 解析文本 / 检索片段</text><text x="210.0" y="239.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">记录上下文 / 用户记忆 / Prompt</text><rect x="40" y="300" width="300" height="80" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="190.0" y="325.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">待向量化文本 / query</text><text x="190.0" y="354.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">分块文本 · 查询语句</text><rect x="40" y="420" width="300" height="80" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="190.0" y="445.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">音频文件</text><text x="190.0" y="474.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">mp3 / wav / m4a / webm</text><rect x="40" y="540" width="300" height="90" rx="8" fill="#E8EEF6" stroke="#64748B" stroke-width="1.6"/><text x="190.0" y="570.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">本地 FunASR（可选）</text><text x="190.0" y="599.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">本地处理 · 不发送至外部 ASR</text><rect x="480" y="160" width="260" height="90" rx="8" fill="#EAF2F0" stroke="#64748B" stroke-width="1.6"/><text x="610.0" y="190.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">LLM Client</text><text x="610.0" y="219.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">/chat/completions</text><rect x="480" y="300" width="260" height="80" rx="8" fill="#EAF2F0" stroke="#64748B" stroke-width="1.6"/><text x="610.0" y="325.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">Embedding Client</text><text x="610.0" y="354.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">/embeddings（1024 维）</text><rect x="480" y="420" width="260" height="80" rx="8" fill="#EAF2F0" stroke="#64748B" stroke-width="1.6"/><text x="610.0" y="445.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">ASR Client</text><text x="610.0" y="474.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">/audio/transcriptions</text><rect x="860" y="160" width="300" height="80" rx="8" fill="#E8EEF6" stroke="#64748B" stroke-width="1.6"/><text x="1010.0" y="185.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">外部 LLM</text><text x="1010.0" y="214.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">→ 回答（返回本地）</text><rect x="860" y="300" width="300" height="80" rx="8" fill="#E8EEF6" stroke="#64748B" stroke-width="1.6"/><text x="1010.0" y="325.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">外部 Embedding</text><text x="1010.0" y="354.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">→ 向量（返回本地）</text><rect x="860" y="420" width="300" height="80" rx="8" fill="#E8EEF6" stroke="#64748B" stroke-width="1.6"/><text x="1010.0" y="445.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">外部 ASR</text><text x="1010.0" y="474.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">→ 转写文本（返回本地）</text><rect x="40" y="690" width="1480" height="120" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/><text x="780.0" y="721.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">BYOK 与数据边界说明</text><text x="780.0" y="750.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">LLM：用户 API Key 以密文存储于平台（Fernet），调用时用于访问用户配置的 LLM 服务；Embedding：服务端统一配置，用户不可自备；</text><text x="780.0" y="779.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">BYOK 不代表所有 AI 数据均不出本地；云端 LLM/Embedding 与外部 ASR 均存在业务内容出网</text><path d="M 380,210 L 480,205" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrP)" stroke-dasharray="7 5"/><text x="430" y="188" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle">LLM（出网）</text><path d="M 340,340 L 480,340" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrP)" stroke-dasharray="7 5"/><text x="410" y="320" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle">Embedding（出网）</text><path d="M 340,460 L 480,460" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrP)" stroke-dasharray="7 5"/><text x="410" y="440" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle">ASR（出网）</text><path d="M 740,205 L 860,200" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrP)" stroke-dasharray="7 5"/><text x="800" y="183" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle">问题/片段</text><path d="M 740,340 L 860,340" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrP)" stroke-dasharray="7 5"/><text x="800" y="320" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle">待向量化文本</text><path d="M 740,460 L 860,460" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrP)" stroke-dasharray="7 5"/><text x="800" y="440" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle">音频文件</text><path d="M 340,585 L 480,460" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/><text x="410" y="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle">本地转写（不出网）</text><path d="M 190,500 L 190,540" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/><text x="235" y="520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="middle">音频</text><line x1="40" y1="860" x2="80" y2="860" stroke="#64748B" stroke-width="1.6"/><text x="88" y="860" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#475569">实线 = 本地处理（不出网）</text><line x1="360" y1="860" x2="400" y2="860" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="7 5"/><text x="408" y="860" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#475569">虚线 = 数据出网（云端/外部服务）</text></svg>